<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>SwiftSkip test lecture</title>
    <style>
      body { margin: 0; padding: 24px; background: #111; color: #ddd; font: 15px/1.5 system-ui, sans-serif; }
      .player { position: relative; max-width: 960px; margin: 0 auto; background: #000; }
      video { display: block; width: 100%; }
      main { max-width: 960px; margin: 16px auto 0; }
      code, kbd { background: #222; padding: 1px 6px; border-radius: 4px; }
      #hls-status { color: #8c8; }
    </style>
  </head>
  <body>
    <!-- Class name contains "player" like Kaltura's, so SwiftSkip's player detection is exercised. -->
    <div class="kaltura-player player">
      <video src="media/lecture.mp4" controls playsinline></video>
    </div>
    <main>
      <p>
        Local stand-in for a Toledo lecture (only the <strong>dev</strong> build runs here).
        Click the page once, then try <kbd>←</kbd> <kbd>→</kbd> <kbd>↑</kbd> <kbd>↓</kbd>
        <kbd>Space</kbd> <kbd>K</kbd> <kbd>M</kbd> <kbd>F</kbd> <kbd>[</kbd> <kbd>]</kbd>
        <kbd>R</kbd> <kbd>0</kbd>–<kbd>9</kbd>.
      </p>
      <p>
        The page also requests an HLS playlist, like Kaltura does, so the
        <strong>Download Lecture</strong> button should appear top-left:
        <span id="hls-status">loading…</span>
      </p>
      <p><input placeholder="Typing here must NOT trigger shortcuts" size="40" /></p>
    </main>
    <script>
      fetch("media/hls/index.m3u8")
        .then((r) => (document.getElementById("hls-status").textContent = r.ok ? "playlist requested ✔" : `HTTP ${r.status}`))
        .catch((e) => (document.getElementById("hls-status").textContent = e.message));
    </script>
  </body>
</html>
