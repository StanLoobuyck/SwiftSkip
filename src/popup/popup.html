<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>SwiftSkip</title>
    <link rel="stylesheet" href="ui.css" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="popup" id="popup">
      <header class="bar">
        <div class="brand">
          <img src="icons/icon48.png" alt="" width="18" height="18" />
          <span>SwiftSkip</span>
        </div>
        <label class="switch" data-i18n-title="popupToggleTitle">
          <input type="checkbox" id="enabled" role="switch" data-i18n-aria-label="swiftskipOn" />
          <span class="switch-track"><span class="switch-thumb"></span></span>
        </label>
      </header>

      <div class="body" id="body">
        <section class="lecture" aria-live="polite">
          <p class="lecture-course" id="lecture-course" hidden></p>
          <p class="lecture-title" id="lecture-title"></p>
          <p class="lecture-hint" id="lecture-hint"></p>

          <div class="site-off" id="site-off" hidden>
            <button class="btn btn-secondary site-enable" id="site-enable" type="button">
              <span data-i18n="enableOn"></span><span id="site-host"></span>
            </button>
            <p class="site-note" data-i18n="enableNote"></p>
          </div>

          <div class="download" id="download">
            <button class="btn btn-primary download-btn" id="download-btn" type="button" hidden>
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11" /><path d="m7 10 5 5 5-5" /><path d="M5 20h14" /></svg>
              <span id="download-label"></span>
            </button>

            <div class="progress" id="progress" hidden>
              <div class="progress-head">
                <span class="progress-phase" id="progress-phase"></span>
                <button class="icon-btn" id="cancel-btn" type="button" data-i18n-title="cancelDownload" data-i18n-aria-label="cancelDownload">
                  <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" /></svg>
                </button>
              </div>
              <div class="progress-track" id="progress-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-labelledby="progress-phase"><div class="progress-fill" id="progress-fill"></div></div>
              <p class="progress-meta" id="progress-meta"></p>
            </div>

            <p class="status status-done" id="done" hidden>
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 5 5 9-10" /></svg>
              <span data-i18n="savedToDownloads"></span>
              <button class="link" id="show-file" type="button" data-i18n="showInFolder"></button>
            </p>
            <p class="status status-error" id="error" role="alert" hidden></p>
          </div>
        </section>

        <section class="controls">
          <div class="row">
            <span class="row-label" id="speed-label" data-i18n="speed"></span>
            <div class="stepper" role="group" aria-labelledby="speed-label">
              <button class="icon-btn" id="speed-down" type="button" data-i18n-title="slower" data-i18n-aria-label="slower">
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14" /></svg>
              </button>
              <output class="stepper-value" id="speed-value" aria-live="polite">–</output>
              <button class="icon-btn" id="speed-up" type="button" data-i18n-title="faster" data-i18n-aria-label="faster">
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>
              </button>
            </div>
          </div>
          <div class="row">
            <span class="row-label" id="skip-label" data-i18n="skip"></span>
            <div class="segmented" id="skip-options" role="radiogroup" aria-labelledby="skip-label"></div>
          </div>
        </section>
      </div>

      <footer class="footer">
        <button class="footer-link" id="open-shortcuts" type="button">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="12" rx="2" /><path d="M7 10h.01M11 10h.01M15 10h.01M7 14h10" /></svg>
          <span data-i18n="shortcuts"></span>
        </button>
        <button class="footer-link" id="open-settings" type="button">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3" /><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z" /></svg>
          <span data-i18n="settings"></span>
        </button>
      </footer>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
