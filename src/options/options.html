<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SwiftSkip</title>
    <link rel="icon" href="icons/icon32.png" />
    <link rel="stylesheet" href="ui.css" />
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main class="page">
      <header class="page-header">
        <img src="icons/icon48.png" alt="" width="32" height="32" />
        <div>
          <h1>SwiftSkip</h1>
          <p class="subtle" id="version-line"></p>
        </div>
      </header>

      <section class="card" aria-labelledby="general-title">
        <h2 id="general-title" data-i18n="general"></h2>

        <div class="setting">
          <div class="setting-text">
            <label class="setting-label" for="enabled" data-i18n="swiftskipOn"></label>
            <p class="setting-desc" id="enabled-desc" data-i18n="enabledDesc"></p>
          </div>
          <label class="switch">
            <input type="checkbox" id="enabled" role="switch" aria-describedby="enabled-desc" />
            <span class="switch-track"><span class="switch-thumb"></span></span>
          </label>
        </div>

        <div class="setting">
          <div class="setting-text">
            <span class="setting-label" id="language-label" data-i18n="language"></span>
            <p class="setting-desc" id="language-desc" data-i18n="languageDesc"></p>
          </div>
          <div
            class="segmented"
            id="language-options"
            role="radiogroup"
            aria-labelledby="language-label"
            aria-describedby="language-desc"
          ></div>
        </div>

        <div class="setting">
          <div class="setting-text">
            <span class="setting-label" id="skip-label" data-i18n="skipInterval"></span>
            <p class="setting-desc" id="skip-desc" data-i18n="skipDesc"></p>
          </div>
          <div
            class="segmented"
            id="skip-options"
            role="radiogroup"
            aria-labelledby="skip-label"
            aria-describedby="skip-desc"
          ></div>
        </div>

        <div class="setting">
          <div class="setting-text">
            <span class="setting-label" id="step-label" data-i18n="speedSteps"></span>
            <p class="setting-desc" id="step-desc" data-i18n="speedStepsDesc"></p>
          </div>
          <div
            class="segmented"
            id="step-options"
            role="radiogroup"
            aria-labelledby="step-label"
            aria-describedby="step-desc"
          ></div>
        </div>

        <div class="setting">
          <div class="setting-text">
            <label class="setting-label" for="remember-speed" data-i18n="rememberSpeed"></label>
            <p class="setting-desc" id="remember-speed-desc"></p>
          </div>
          <label class="switch">
            <input type="checkbox" id="remember-speed" role="switch" aria-describedby="remember-speed-desc" />
            <span class="switch-track"><span class="switch-thumb"></span></span>
          </label>
        </div>

        <div class="setting">
          <div class="setting-text">
            <label class="setting-label" for="resume" data-i18n="resume"></label>
            <p class="setting-desc">
              <span id="resume-desc" data-i18n="resumeDesc"></span>
              <button class="link" id="forget-positions" type="button" hidden></button>
            </p>
          </div>
          <label class="switch">
            <input type="checkbox" id="resume" role="switch" aria-describedby="resume-desc" />
            <span class="switch-track"><span class="switch-thumb"></span></span>
          </label>
        </div>
      </section>

      <section class="card" id="shortcuts" aria-labelledby="shortcuts-title">
        <div class="card-head">
          <h2 id="shortcuts-title" data-i18n="keyboardShortcuts"></h2>
          <button
            class="btn btn-secondary btn-small"
            id="reset-shortcuts"
            type="button"
            data-i18n="resetDefaults"
          ></button>
        </div>
        <p class="subtle card-intro" data-i18n="shortcutsIntro"></p>
        <p class="notice" id="shortcut-notice" role="status" aria-live="polite" hidden></p>
        <div id="shortcut-groups"></div>
      </section>

      <section class="card" id="sites" aria-labelledby="sites-title">
        <h2 id="sites-title" data-i18n="sites"></h2>
        <p class="subtle card-intro" data-i18n="sitesIntro"></p>
        <ul class="site-list" id="site-list"></ul>
      </section>

      <section class="card about" aria-labelledby="about-title">
        <h2 id="about-title" data-i18n="about"></h2>
        <p class="subtle" data-i18n="aboutText"></p>
        <p class="links">
          <a
            href="https://github.com/StanLoobuyck/SwiftSkip/issues/new"
            target="_blank"
            rel="noopener"
            data-i18n="reportProblem"
          ></a>
          <a
            href="https://github.com/StanLoobuyck/SwiftSkip"
            target="_blank"
            rel="noopener"
            data-i18n="sourceCode"
          ></a>
          <a
            href="https://github.com/StanLoobuyck/SwiftSkip/blob/main/PRIVACY.md"
            target="_blank"
            rel="noopener"
            data-i18n="privacy"
          ></a>
        </p>
      </section>
    </main>
    <script src="options.js"></script>
  </body>
</html>
